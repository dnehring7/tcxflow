#
# On a new release tag (vX.Y.Z): run ci, build & sign RPMs (AlmaLinux 10) and DEBs (Debian 13),
# attach them to the GitHub Release, and publish DNF / APT repos via GitHub Pages.
#
# Prereqs:
#   Repo secret: GPG_PRIVATE_KEY (armored, unencrypted); its public key in the owner's GitHub
#   profile (https://github.com/<owner>.gpg), which the repo configs point to.

name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read   # publish overrides to write for action-gh-release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# bash -eo pipefail: a failing command in a pipe (curl | sed) fails the step.
defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}
  EL_REL: '10'
  CODENAME: trixie

jobs:
  # Formatting, lint, strict builds on every distribution, BPF and end-to-end tests: no
  # packages from a tag that fails them.
  ci:
    uses: ./.github/workflows/ci.yml

  # ================================================================
  # rpm -- build + sign RPMs, assemble the dnf repo (AlmaLinux 10)
  # ================================================================
  rpm:
    name: rpm (almalinux 10)
    needs: ci
    runs-on: ubuntu-26.04
    container: almalinux:10
    outputs:
      version: ${{ steps.prep.outputs.version }}

    steps:
      - name: Install build prerequisites
        run: |
          dnf install -y --enablerepo=crb \
            git gnupg2 rpm-build rpm-sign createrepo_c 'dnf-command(builddep)'

      - name: Checkout tag source
        uses: actions/checkout@v7

      - name: Prepare build
        id: prep
        uses: ./.github/actions/prepare-build
        with:
          tag: ${{ env.TAG }}

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure rpm signing
        env:
          KEYFP: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          cat > ~/.rpmmacros <<EOF
          %_gpg_name ${KEYFP}
          %_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback
          EOF

      - name: Install build deps
        run: dnf builddep -y --enablerepo=crb tcxflow.spec

      - name: Build, sign & assemble repo
        env:
          KEYFP: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          git config --global --add safe.directory '*'
          git archive --format=tar.gz --prefix="tcxflow-${V}/" HEAD -o "tcxflow-${V}.tar.gz"
          # find-debuginfo strips the binary (debug_package %{nil} would leave its symbol table); its
          # -debuginfo / -debugsource packages are not published, as the .deb has no -dbgsym.
          rpmbuild -ta "tcxflow-${V}.tar.gz"
          rm "${HOME}"/rpmbuild/RPMS/x86_64/tcxflow-debug*.rpm
          rpm --addsign "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm "${HOME}"/rpmbuild/SRPMS/*.rpm
          # Repo layout matches the URL the .repo file will hand to dnf:
          #   <pages>/almalinux/<rel>/x86_64/{*.rpm, repodata/}
          REPO_DIR="repo/${EL_REL}/x86_64"
          mkdir -p "${REPO_DIR}"
          cp "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm "${REPO_DIR}/"
          createrepo_c "${REPO_DIR}/"
          gpg --batch --yes --pinentry-mode loopback --local-user "${KEYFP}" \
            --detach-sign --armor "${REPO_DIR}/repodata/repomd.xml"
          # Stage release-only artifacts (binary + source RPMs) outside the repo dir.
          mkdir -p pkgs
          cp "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm "${HOME}"/rpmbuild/SRPMS/*.rpm pkgs/

      - name: Test the packages
        env:
          KEYFP: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          # Signed, installable, at the version of the tag, and stripped.
          gpg --batch --armor --export "${KEYFP}" > /tmp/key.asc
          rpm --import /tmp/key.asc
          for f in pkgs/*.rpm; do rpm -K "$f" | grep -q 'digests signatures OK' || { rpm -K "$f"; exit 1; }; done
          dnf install -y repo/"${EL_REL}"/x86_64/tcxflow-*.rpm
          tcxflow --version | grep -qx "tcxflow ${TAG}"
          tcxflow check
          readelf -SW /usr/sbin/tcxflow | awk '/\.symtab/ {print "::error::tcxflow is not stripped"; s = 1} END {exit s}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: |
            repo/
            pkgs/

  # ================================================================
  # deb -- build .deb only (Debian 13)
  # ================================================================
  # Pure dpkg-buildpackage; no GPG, no repo metadata. The publish job
  # turns the .deb into a signed apt repo.
  deb:
    name: deb (debian 13)
    needs: ci
    runs-on: ubuntu-26.04
    container: debian:13

    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            build-essential debhelper fakeroot dpkg-dev clang libbpf-dev bpftool pkg-config

      - name: Checkout tag source
        uses: actions/checkout@v7

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          tag: ${{ env.TAG }}

      - name: Build .deb
        run: |
          git config --global --add safe.directory '*'
          MAINTAINER=$(git log -1 --format='%an <%ae>' HEAD)
          cat > debian/changelog <<EOF
          tcxflow (${V}+${CODENAME}1) ${CODENAME}; urgency=medium

            * Release ${V}

           -- ${MAINTAINER}  $(date -R)
          EOF
          DEB_BUILD_OPTIONS=noautodbgsym dpkg-buildpackage -us -uc -b
          mkdir -p _out && mv ../*.deb _out/

      - name: Test the package
        run: |
          # Installable, at the version of the tag, and stripped.
          apt-get install -y ./_out/tcxflow_*.deb
          tcxflow --version | grep -qx "tcxflow ${TAG}"
          tcxflow check
          readelf -SW /usr/sbin/tcxflow | awk '/\.symtab/ {print "::error::tcxflow is not stripped"; s = 1} END {exit s}'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-debian-${{ env.CODENAME }}
          path: _out/*.deb

  # ================================================================
  # publish -- sign apt repo, upload to release, deploy Pages
  # ================================================================
  publish:
    name: publish
    needs: [rpm, deb]
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # softprops/action-gh-release
      pages: write      # actions/deploy-pages
      id-token: write   # actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERSION: ${{ needs.rpm.outputs.version }}
      OWNER: ${{ github.repository_owner }}
      PKG: ${{ github.event.repository.name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      # dpkg-dev (dpkg-scanpackages) and gpg come with the runner; apt-utils (apt-ftparchive) is
      # no longer part of Ubuntu 26.04's base system.
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts/

      - name: Stage AlmaLinux repo
        run: |
          mkdir -p site
          cp -a _artifacts/rpm/repo/. site/almalinux/

      - name: Build & sign apt repo
        env:
          KEYFP: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          REPO_DIR="site/debian"
          mkdir -p "${REPO_DIR}"
          cp _artifacts/deb-debian-"${CODENAME}"/*.deb "${REPO_DIR}/"
          cd "${REPO_DIR}"
          dpkg-scanpackages --arch amd64 . > Packages
          gzip -k Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="${PKG}" \
            -o APT::FTPArchive::Release::Label="${PKG}" \
            -o APT::FTPArchive::Release::Suite="${CODENAME}" \
            -o APT::FTPArchive::Release::Codename="${CODENAME}" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            release . > Release
          gpg --batch --yes --pinentry-mode loopback --local-user "${KEYFP}" \
            --detach-sign --armor -o Release.gpg Release
          gpg --batch --yes --pinentry-mode loopback --local-user "${KEYFP}" \
            --clearsign -o InRelease Release

      - name: Generate repo configs and landing page
        run: |
          # DNF repo file: dnf fetches gpgkey on first install.
          cat > "site/almalinux/${EL_REL}/${PKG}.repo" <<REPO
          [${PKG}]
          name=${PKG} packages for AlmaLinux ${EL_REL}
          baseurl=${PAGES_URL}/almalinux/${EL_REL}/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=https://github.com/${OWNER}.gpg
          repo_gpgcheck=1
          REPO
          # DEB822 sources with inline Signed-By: the trust anchor travels
          # with the file. Each armored line is space-prefixed; blank lines
          # become " ." per the DEB822 spec.
          cat > "site/debian/${PKG}.sources" <<SOURCES
          Types: deb
          URIs: ${PAGES_URL}/debian/
          Suites: ./
          Architectures: amd64
          Signed-By:
          SOURCES
          curl -fsSL "https://github.com/${OWNER}.gpg" \
            | sed -e 's/^$/./' -e 's/^/ /' \
            >> "site/debian/${PKG}.sources"
          printf '\n' >> "site/debian/${PKG}.sources"
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>${PKG} packages</title></head>
          <body>
          <h1>${PKG} ${VERSION}</h1>

          <h2>Debian 13 / Trixie (amd64)</h2>
          <pre>
          sudo curl -fsSL ${PAGES_URL}/debian/${PKG}.sources \\
            -o /etc/apt/sources.list.d/${PKG}.sources
          sudo apt update
          sudo apt install ${PKG}
          </pre>

          <h2>AlmaLinux ${EL_REL} (x86_64)</h2>
          <pre>
          sudo curl -fsSL ${PAGES_URL}/almalinux/${EL_REL}/${PKG}.repo \\
            -o /etc/yum.repos.d/${PKG}.repo
          sudo dnf install ${PKG}
          </pre>
          </body>
          </html>
          HTML

      - name: Upload packages to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            _artifacts/rpm/pkgs/*.rpm
            _artifacts/deb-*/*.deb

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
