# /etc/tcxflow/tcxflow.conf
#
# One option per line, with the same names as the command line options
# (tcxflow --help). "option value" or "option = value"; # starts a comment.

# Network namespace that contains the interfaces: a name from /run/netns or the
# path of a bind mount (/run/docker/netns/...). Leave it out if they are in the root
# namespace. For a namespace known only by a process, run "ip netns attach NAME PID".
#netns dataplane

# Interfaces to meter, one line each: NAME, NAME:in or NAME:out (default: both).
interface eth0
#interface eth1:in

# IPFIX collectors (UDP), one line each: host:port or [ipv6]:port.
collector 192.0.2.10:4739

# Export a flow after this many seconds without packets / at least every N seconds.
inactive-timeout 15
active-timeout   1800

# BPF flow table size per one-second interval; raise it if the log warns about a full table.
#max-flows 131072

# IPFIX observation domain id, to tell several exporters apart at one collector.
#observation-domain 1

# Control socket used by "tcxflow stats" and "tcxflow interfaces".
#socket /run/tcxflow/tcxflow.sock
